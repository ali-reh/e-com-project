<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - All Products</title>
    <link rel="stylesheet" href="../style/loading-screen.css">
    <link rel="stylesheet" href="../style/header.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/buttons.css">
    <link rel="stylesheet" href="../style/shop.css">
    <link rel="stylesheet" href="../style/footer.css">
    <link rel="stylesheet" href="../style/categories-sidebar.css">
    <link rel="stylesheet" href="../style/cart.css">
    <link rel="stylesheet" href="../style/cart-modal.css">
    <link rel="stylesheet" href="../style/search.css">
    <script src="../scripts/loading-screen.js"></script>
    <script>window.setWaitingForData(true);</script>
    <script src="../scripts/cart.js"></script>
    <script src="../scripts/cart-modal.js"></script>
    <script src="../scripts/categories-sidebar.js"></script>
    <script src="../scripts/search.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-logo">BRAND</div>
        <div class="loading-indicator">
            <div class="loading-dots">
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
            </div>
            <div class="loading-line"></div>
        </div>
    </div>

    <div id="header"></div>
    <script>
        fetch('../pages/header.html')
        .then(res => res.text())
        .then(html => {
            document.getElementById('header').innerHTML = html;
        });
    </script>

    <div id="footer"></div>
    <script>
        fetch('../pages/footer.html')
        .then(res => res.text())
        .then(html => {
            document.getElementById('footer').innerHTML = html;
        });
    </script>

    <script src="../scripts/shop.js"></script>
</body>
</html>
