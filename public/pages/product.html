<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="../style/loading-screen.css">
    <link rel="stylesheet" href="../style/header.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/buttons.css">
    <link rel="stylesheet" href="../style/product.css">
    <link rel="stylesheet" href="../style/footer.css">
    <link rel="stylesheet" href="../style/categories-sidebar.css">
    <link rel="stylesheet" href="../style/cart.css">
    <script src="../scripts/loading-screen.js"></script>
    <script>window.setWaitingForData(true);</script>
    <script src="../scripts/cart.js"></script>
    <script src="../scripts/categories-sidebar.js"></script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-logo">BRAND</div>
        <div class="loading-indicator">
            <div class="loading-dots">
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
            </div>
            <div class="loading-line"></div>
        </div>
    </div>

    <div id="header"></div>

    <main class="product-detail-section">
        <div class="container">
            <!-- Breadcrumb -->
            <nav class="breadcrumb-nav">
                <a href="/">Home</a>
                <span class="divider">/</span>
                <a href="../pages/shop.html">Shop</a>
                <span class="divider">/</span>
                <span class="current"></span>
            </nav>

            <!-- Product Main (populated by JavaScript) -->
            <div class="product-main">
                <!-- Image Gallery -->
                <div class="product-gallery">
                    <div class="gallery-main">
                        <img src="" alt="Product Image" id="mainImage">
                    </div>
                    <div class="gallery-thumbs">
                        <!-- Thumbnails will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Product Info -->
                <div class="product-info">
                    <div class="product-header">
                        <h1 class="product-name"></h1>
                    </div>

                    <div class="product-price-section">
                        <div class="price-group">
                            <span class="current-price">$0</span>
                        </div>
                    </div>

                    <div class="product-description">
                        <p></p>
                    </div>

                    <div class="product-actions">
                        <div class="quantity-selector">
                            <button class="qty-btn" id="decreaseQty">−</button>
                            <input type="number" id="quantity" value="1" min="1" readonly>
                            <button class="qty-btn" id="increaseQty">+</button>
                        </div>
                        <button class="btn-add-to-cart primary-color-btn">
                            <i class="bi bi-bag-plus"></i> Add to Cart
                        </button>
                    </div>

                    <div class="product-features">
                        <div class="feature">
                            <i class="bi bi-truck"></i>
                            <div>
                                <span class="feature-title">Free Shipping</span>
                                <span class="feature-text">On orders over $100</span>
                            </div>
                        </div>
                        <div class="feature">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            <div>
                                <span class="feature-title">Easy Returns</span>
                                <span class="feature-text">30-day return policy</span>
                            </div>
                        </div>
                        <div class="feature">
                            <i class="bi bi-shield-check"></i>
                            <div>
                                <span class="feature-title">Secure Payment</span>
                                <span class="feature-text">100% protected checkout</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    
    <script>
        // Header fetch
        fetch('header.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('header').innerHTML = html;
            });

        // Footer fetch
        fetch('footer.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('footer').innerHTML = html;
            });
    </script>

    <!-- Product detail script -->
    <script src="../scripts/product.js"></script>
</body>
</html>
